<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#022c22" flood-opacity="0.4" />
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="100" fill="url(#grad)" filter="url(#shadow)" />
  
  <!-- Subtle Grid pattern -->
  <g opacity="0.1" stroke="#ffffff" stroke-width="4">
    <line x1="80" y1="160" x2="432" y2="160" />
    <line x1="80" y1="240" x2="432" y2="240" />
    <line x1="80" y1="320" x2="432" y2="320" />
    <line x1="160" y1="80" x2="160" y2="432" />
    <line x1="280" y1="80" x2="280" y2="432" />
    <line x1="380" y1="80" x2="380" y2="432" />
  </g>

  <!-- Laptop / Screen Monitor -->
  <rect x="110" y="120" width="292" height="190" rx="16" fill="#0f172a" stroke="#10b981" stroke-width="8" />
  <rect x="126" y="136" width="260" height="158" rx="8" fill="#1e293b" />
  
  <!-- Spreadsheet lines inside screen -->
  <rect x="146" y="156" width="100" height="18" rx="4" fill="#10b981" />
  <rect x="256" y="156" width="110" height="18" rx="4" fill="#38bdf8" />
  
  <rect x="146" y="186" width="60" height="12" rx="3" fill="#64748b" />
  <rect x="216" y="186" width="70" height="12" rx="3" fill="#ef4444" />
  <rect x="296" y="186" width="70" height="12" rx="3" fill="#10b981" />

  <rect x="146" y="210" width="80" height="12" rx="3" fill="#94a3b8" />
  <rect x="236" y="210" width="50" height="12" rx="3" fill="#f59e0b" />
  <rect x="296" y="210" width="70" height="12" rx="3" fill="#10b981" />

  <rect x="146" y="234" width="70" height="12" rx="3" fill="#64748b" />
  <rect x="226" y="234" width="60" height="12" rx="3" fill="#10b981" />
  <rect x="296" y="234" width="70" height="12" rx="3" fill="#ef4444" />

  <!-- Base of computer -->
  <path d="M220 310 L292 310 L308 360 L204 360 Z" fill="#334155" />
  <rect x="170" y="360" width="172" height="16" rx="8" fill="#0f172a" />

  <!-- Mouse accessory -->
  <ellipse cx="380" cy="380" rx="28" ry="38" fill="#f8fafc" stroke="#cbd5e1" stroke-width="4" />
  <line x1="380" y1="350" x2="380" y2="375" stroke="#94a3b8" stroke-width="3" />
  <ellipse cx="380" cy="370" rx="4" ry="7" fill="#059669" />

  <!-- Branch Badge "1-22" -->
  <rect x="76" y="380" width="140" height="52" rx="12" fill="#0f172a" stroke="#34d399" stroke-width="4" />
  <text x="146" y="415" font-family="'JetBrains Mono', monospace, sans-serif" font-weight="bold" font-size="24" fill="#34d399" text-anchor="middle">B 1-22</text>
</svg>
